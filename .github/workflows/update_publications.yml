name: Update Publications

on:
  schedule:
    # Runs bi-weekly: on the 1st and 15th of every month at 02:00 UTC
    - cron: '0 2 1,15 * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full historical sync from 2016 (default: 6-month incremental)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Run publications updater
        run: |
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            echo "Running full historical sync..."
            python scripts/update_publications.py --full
          else
            echo "Running incremental 6-month sync..."
            python scripts/update_publications.py --days 180
          fi

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications/publications.json src/data/publications/journal_rankings.json src/data/publications/publications_manual.json
          if git diff --staged --quiet; then
            echo "No changes detected in publications data."
          else
            echo "Committing updated publications data..."
            git commit -m "chore(publications): auto-update publications database [skip ci]"
            git push origin gh-pages
          fi
