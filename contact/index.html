<script>
    var map = L.map('map').setView([40.33597, -3.87690], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png?lang=en', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        fullscreenControl: true,
    }).addTo(map);

    var dslabIcon = L.icon({
        iconUrl: '/assets/images/favicon-96x96.png',

        iconSize:     [30, 30], // size of the icon
        iconAnchor:   [15, 15], // point of the icon which will correspond to marker's location
        popupAnchor:  [0, -15] // point from which the popup should open relative to the iconAnchor
    });

    var marker = L.marker([40.33583, -3.87796], {icon: dslabIcon}).addTo(map);
    marker.bindPopup("Data Science Laboratory", {
        closeButton: false
    });

    L.control.scale({imperial: false,}).addTo(map);
</script>
