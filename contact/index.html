<link href="{{ site.url }}/assets/plugins/leaflet/leaflet.css" rel="stylesheet"/>
<script type="text/javascript" src="{{ site.url }}/assets/plugins/leaflet/leaflet.js"></script>

<script>
    var map = L.map('map').setView([40.335993, -3.878040], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png?lang=en', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        fullscreenControl: true,
    }).addTo(map);

    var dslabIcon = L.icon({
        iconUrl: '{{ site.url }}/assets/images/favicon-96x96.png',
        shadowUrl: '{{ site.url }}/assets/plugins/leaflet/images/marker-shadow.png',

        iconSize:     [60, 60],   // size of the icon
        iconAnchor:   [30, 60],   // point of the icon which will correspond to marker's location
        popupAnchor:  [0, -60],   // point from which the popup should open relative to the iconAnchor
        shadowSize:   [100, 100], // size of the shadow
        shadowAnchor: [30, 95]    // point of the shadow which will correspond to marker's location
    });

    var marker = L.marker([40.33583, -3.87796], {icon: dslabIcon}).addTo(map);
    marker.bindPopup("Data Science Laboratory", {
        closeButton: false
    });

    L.control.scale({imperial: false,}).addTo(map);
</script>
